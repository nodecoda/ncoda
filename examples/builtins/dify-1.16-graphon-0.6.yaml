# 内建节点结果契约 —— 目标 dify-1.16-graphon-0.6
# 口径见本目录 README.md。
schema_version: 1
target: dify-1.16-graphon-0.6
builtins:
  http:
    # 语言层结果原型（权威 = internal/binding/symbol.go）。
    result: HTTPResponse
    # ② 平台一手：dify http-request 节点端口 = response / headers /
    #   status_code / body（+ 失败分支 error_message / error_type），
    #   见 internal/backend/dify/analyzer/type_system.go 的节点端口表
    #   （与 dify 源码 entities.py 同源）。
    # 语言层已裁定不含平台专属字段（dify 的 response / files 不进语言，C2 R2）
    # ⇒ 此处只声明有语言层对应的三个口。
    ports:
      - port: body
        lang: body
        type: string
      - port: status_code
        lang: status_code
        type: integer
      - port: headers
        lang: headers
        type: object
