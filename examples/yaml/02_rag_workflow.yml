app:
  mode: workflow
  name: 02_rag_workflow
kind: app
version: 0.1.5
workflow:
  graph:
    edges:
    - id: e1
      source: start
      target: retrieval
      type: custom
    - id: e2
      source: retrieval
      target: llm
      type: custom
    - id: e3
      source: llm
      target: answer
      type: custom
    nodes:
    - data:
        title: 开始
        type: start
        variables: []
      id: start
      position:
        x: 0
        y: 280
      type: custom
    - data:
        dataset_ids:
        - ds-001
        - ds-002
        query: '{{#sys.query#}}'
        title: 知识库检索
        type: knowledge-retrieval
      id: retrieval
      position:
        x: 320
        y: 200
      type: custom
    - data:
        max_tokens: 4096
        model:
          name: gpt-4o
          provider: openai
        prompt_template:
        - role: system
          text: 根据以下参考资料回答用户问题。
        - role: user
          text: '参考资料：{{#retrieval.result#}}


            用户问题：{{#sys.query#}}'
        temperature: 0.3
        title: 生成回答
        type: llm
      id: llm
      position:
        x: 640
        y: 280
      type: custom
    - data:
        answer: '{{#llm.text#}}'
        title: 输出
        type: answer
      id: answer
      position:
        x: 960
        y: 280
      type: custom
    viewport:
      x: 0
      y: 0
      zoom: 0.7
