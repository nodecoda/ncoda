app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: switch1
          type: number
          variable: switch1
          required: true
        - label: switch2
          type: number
          variable: switch2
          required: true
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(switch1) -> dict:\n    return {\"result\": (\"switch 1 on\"\
          \ if (switch1 == 1) else \"switch 1 off\")}"
        variables:
        - value_selector:
          - start_1
          - switch1
          value_type: number
          variable: switch1
        outputs:
          result:
            type: string
            children: null
    - id: code_3
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main(switch2) -> dict:\n    return {\"result\": (\"switch 2 on\"\
          \ if (switch2 == 1) else \"switch 2 off\")}"
        variables:
        - value_selector:
          - start_1
          - switch2
          value_type: number
          variable: switch2
        outputs:
          result:
            type: string
            children: null
    - id: end_4
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: g1
          value_type: string
          value_selector:
          - code_2
          - result
        - variable: g2
          value_type: string
          value_selector:
          - code_3
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: code_2
      sourceHandle: ''
      target: code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_3
      source: code_3
      sourceHandle: ''
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
