app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: value
          type: number
          variable: value
          default: 2
    - id: condition_3
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "# ncoda:shim 1\ndef main(value) -> dict:\n    return {\"result\": ((value\
          \ + 1) > 2)}"
        variables:
        - value_selector:
          - start_1
          - value
          value_type: number
          variable: value
        outputs:
          result:
            type: boolean
            children: null
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - condition_3
            - result
            comparison_operator: is
            value: 'true'
    - id: code_4
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": \"yes\"}"
        variables: []
        outputs:
          result:
            type: string
            children: null
    - id: code_5
      type: custom
      data:
        type: code
        title: Code 3
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": \"no\"}"
        variables: []
        outputs:
          result:
            type: string
            children: null
    - id: end_6
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - code_4
          - result
    edges:
    - id: edge_1
      source: condition_3
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
    - id: edge_2
      source: start_1
      sourceHandle: ''
      target: condition_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_3
      source: if_2
      sourceHandle: if_2_case_0
      target: code_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
    - id: edge_4
      source: if_2
      sourceHandle: 'false'
      target: code_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
    - id: edge_5
      source: code_4
      sourceHandle: ''
      target: end_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    - id: edge_6
      source: code_5
      sourceHandle: ''
      target: end_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
