app:
  mode: advanced-chat
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - id: d630f615-7ee9-5d3e-aa03-54ebe47ad98a
    name: visitor
    value_type: string
    value: anonymous
    description: ''
    selector:
    - conversation
    - visitor
  - id: 5b371eef-6489-5b7b-b5f8-519fb9da4532
    name: visit_count
    value_type: integer
    value: 0
    description: ''
    selector:
    - conversation
    - visit_count
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
    - id: assigner_2
      type: custom
      data:
        type: assigner
        title: assigner
        items:
        - variable_selector:
          - conversation
          - visitor
          operation: set
          input_type: constant
          value: hello
        version: '2'
    - id: assigner_3
      type: custom
      data:
        type: assigner
        title: assigner 2
        items:
        - variable_selector:
          - conversation
          - visit_count
          operation: +=
          input_type: constant
          value: 1
        version: '2'
    - id: answer_4
      type: custom
      data:
        type: answer
        title: Answer
        answer: '{{#conversation.visitor#}}'
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: assigner_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: assigner
    - id: edge_2
      source: assigner_2
      sourceHandle: ''
      target: assigner_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: assigner
        targetType: assigner
    - id: edge_3
      source: assigner_3
      sourceHandle: ''
      target: answer_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: assigner
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
