app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: value
          type: number
          variable: value
          default: 3
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(value: int) -> dict:\n    return {\"result\": value * 2}"
        variables:
        - value_selector:
          - start_1
          - value
          value_type: number
          variable: value
        outputs:
          result:
            type: number
            children: null
    - id: end_3
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: number
          value_selector:
          - code_2
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: code_2
      sourceHandle: ''
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
