app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: seed
          type: text-input
          variable: seed
          default: probe
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(seed: str) -> dict:\n    return {\"result\": f\"left:{seed}\"\
          }"
        variables:
        - value_selector:
          - start_1
          - seed
          value_type: string
          variable: seed
        outputs:
          result:
            type: string
            children: null
    - id: code_3
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main(seed: str) -> dict:\n    return {\"result\": f\"right:{seed}\"\
          }"
        variables:
        - value_selector:
          - start_1
          - seed
          value_type: string
          variable: seed
        outputs:
          result:
            type: string
            children: null
    - id: code_4
      type: custom
      data:
        type: code
        title: Code 3
        code_language: python3
        code: "def main(left: str, right: str) -> dict:\n    return {\"result\": f\"\
          {left}|{right}\"}"
        variables:
        - value_selector:
          - code_2
          - result
          value_type: string
          variable: left
        - value_selector:
          - code_3
          - result
          value_type: string
          variable: right
        outputs:
          result:
            type: string
            children: null
    - id: end_5
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - code_4
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: start_1
      sourceHandle: ''
      target: code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_3
      source: code_2
      sourceHandle: ''
      target: code_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_4
      source: code_3
      sourceHandle: ''
      target: code_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_5
      source: code_4
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
