app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
        - label: language
          type: text-input
          variable: language
          default: 中文
    - id: llm_2
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.7
            max_tokens: 2048
        prompt_template:
        - role: system
          text: 你是一个有用的助手，请用 {{#start_1.language#}} 回答。
        - role: user
          text: '{{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - language
          value_type: string
          variable: value_1
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_2
    - id: end_3
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_2
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: llm_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_2
      source: llm_2
      sourceHandle: ''
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
