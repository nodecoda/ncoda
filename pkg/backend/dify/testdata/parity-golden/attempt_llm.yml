app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables: []
    - id: llm_2
      type: custom
      data:
        type: llm
        title: LLM
        error_strategy: fail-branch
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
        prompt_template:
        - role: user
          text: hi
        context:
          enabled: false
          variable_selector: []
        retry_config:
          max_retries: 2
          retry_interval: 1000
          retry_enabled: true
    - id: code_3
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": \"ok\"}"
        variables: []
        outputs:
          result:
            type: string
            children: null
    - id: end_4
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - code_3
          - result
    - id: code_5
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": \"failed\"}"
        variables: []
        outputs:
          result:
            type: string
            children: null
    - id: end_6
      type: custom
      data:
        type: end
        title: Output 2
        outputs:
        - variable: output_2
          value_type: string
          value_selector:
          - code_5
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: llm_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_2
      source: code_3
      sourceHandle: ''
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    - id: edge_3
      source: llm_2
      sourceHandle: source
      target: code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
    - id: edge_4
      source: code_5
      sourceHandle: ''
      target: end_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    - id: edge_5
      source: llm_2
      sourceHandle: fail-branch
      target: code_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
