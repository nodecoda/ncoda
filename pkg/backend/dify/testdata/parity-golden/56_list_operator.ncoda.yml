app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: csv
          type: text-input
          variable: csv
          required: true
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(csv) -> dict:\n    return {\"result\": csv.split(\",\")}"
        variables:
        - value_selector:
          - start_1
          - csv
          value_type: string
          variable: csv
        outputs:
          result:
            type: array[string]
            children: null
    - id: list_operator_3
      type: custom
      data:
        type: list-operator
        title: list-operator
        variable:
        - code_2
        - result
        filter_by:
          enabled: true
          conditions:
          - key: ''
            comparison_operator: contains
            value: a
        extract_by:
          enabled: false
          serial: '1'
        order_by:
          enabled: false
          key: ''
          value: asc
        limit:
          enabled: false
          size: -1
        var_type: array[string]
        item_var_type: string
    - id: list_operator_4
      type: custom
      data:
        type: list-operator
        title: list-operator 2
        variable:
        - list_operator_3
        - result
        filter_by:
          enabled: false
          conditions: []
        extract_by:
          enabled: false
          serial: '1'
        order_by:
          enabled: false
          key: ''
          value: asc
        limit:
          enabled: true
          size: 10
        var_type: array[string]
        item_var_type: string
    - id: output_5
      type: custom
      data:
        type: end
        title: output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - list_operator_4
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: code_2
      sourceHandle: ''
      target: list_operator_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: list-operator
    - id: edge_3
      source: list_operator_3
      sourceHandle: ''
      target: list_operator_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: list-operator
        targetType: list-operator
    - id: edge_4
      source: list_operator_4
      sourceHandle: ''
      target: output_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: list-operator
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
