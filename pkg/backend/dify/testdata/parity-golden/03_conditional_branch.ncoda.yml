app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
        - label: language
          type: text-input
          variable: language
          default: 中文
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - language
            comparison_operator: is
            value: 中文
        - case_id: if_2_case_1
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - language
            comparison_operator: is
            value: Chinese
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.5
            max_tokens: 2048
        prompt_template:
        - role: user
          text: 请用中文回答：{{#start_1.query#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_1
    - id: llm_4
      type: custom
      data:
        type: llm
        title: LLM 2
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.5
            max_tokens: 1024
        prompt_template:
        - role: user
          text: 'Please answer in English: {{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_1
    - id: end_5
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_3
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
    - id: edge_2
      source: if_2
      sourceHandle: if_2_case_0
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
    - id: edge_3
      source: if_2
      sourceHandle: if_2_case_1
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
    - id: edge_4
      source: if_2
      sourceHandle: 'false'
      target: llm_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
    - id: edge_5
      source: llm_3
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    - id: edge_6
      source: llm_4
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
