app:
  mode: advanced-chat
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: file
          variable: query
          required: true
          allowed_file_types: []
          allowed_file_extensions: []
          allowed_file_upload_methods: []
    - id: answer_2
      type: custom
      data:
        type: answer
        title: Answer
        answer: ok
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: answer_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
