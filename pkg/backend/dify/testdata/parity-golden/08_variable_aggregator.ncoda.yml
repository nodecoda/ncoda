app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: text
          type: text-input
          variable: text
          required: true
    - id: llm_2
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 256
        prompt_template:
        - role: user
          text: 请对以下文本生成摘要：\n{{#start_1.text#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - text
          value_type: string
          variable: value_1
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM 2
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 128
        prompt_template:
        - role: user
          text: 请从以下文本中提取 5 个关键词：\n{{#start_1.text#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - text
          value_type: string
          variable: value_1
    - id: llm_4
      type: custom
      data:
        type: llm
        title: LLM 3
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.5
        prompt_template:
        - role: user
          text: 摘要：{{#llm_2.text#}}\n\n关键词：{{#llm_3.text#}}\n\n请基于以上信息写一段综合分析。
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - llm_2
          - text
          value_type: string
          variable: value_1
        - value_selector:
          - llm_3
          - text
          value_type: string
          variable: value_2
    - id: end_5
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_4
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: llm_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_2
      source: start_1
      sourceHandle: ''
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_3
      source: llm_2
      sourceHandle: ''
      target: llm_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
    - id: edge_4
      source: llm_3
      sourceHandle: ''
      target: llm_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: llm
    - id: edge_5
      source: llm_4
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
