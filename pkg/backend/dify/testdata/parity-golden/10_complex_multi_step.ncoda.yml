app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
        - label: context
          type: text-input
          variable: context
          default: ''
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - query
            comparison_operator: contains
            value: 知识
    - id: knowledge_3
      type: custom
      data:
        type: knowledge-retrieval
        title: Knowledge Retrieval
        dataset_ids:
        - ds-001
        query_variable_selector:
        - start_1
        - query
        query: ''
        retrieval_mode: single
        single_retrieval_config:
          model:
            completion_params: {}
            mode: chat
            name: ''
            provider: ''
    - id: http_4
      type: custom
      data:
        type: http-request
        title: HTTP Request
        method: POST
        url: https://api.example.com/search
        headers: ''
        params: ''
        body:
          type: none
          data: ''
        authorization:
          type: no-auth
        variables:
        - - start_1
          - query
    - id: llm_5
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 4096
        prompt_template:
        - role: system
          text: 你是一个知识助手，根据参考资料回答问题。
        - role: user
          text: 参考资料：{{#knowledge_3.result#}}\n问题：{{#start_1.query#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - knowledge_3
          - result
          value_type: array[object]
          variable: value_1
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_2
    - id: code_6
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "# ncoda:shim 1\ndef main(query, context) -> dict:\n    return {\"result\"\
          : (\"\\u95ee\\u9898\\uff1a\" + str(query) + \"\" + (\"\\\\n\\u4e0a\\u4e0b\\\
          u6587\\uff1a\" + str(context) + \"\" if (context != \"\") else \"\"))}"
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: query
        - value_selector:
          - start_1
          - context
          value_type: string
          variable: context
        outputs:
          result:
            type: string
            children: null
    - id: llm_7
      type: custom
      data:
        type: llm
        title: LLM 2
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.7
            max_tokens: 2048
        prompt_template:
        - role: user
          text: '{{#code_6.result#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - code_6
          - result
          value_type: string
          variable: value_1
    - id: end_8
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_5
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
    - id: edge_2
      source: if_2
      sourceHandle: if_2_case_0
      target: knowledge_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: knowledge-retrieval
    - id: edge_3
      source: knowledge_3
      sourceHandle: ''
      target: http_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: http-request
    - id: edge_4
      source: http_4
      sourceHandle: ''
      target: llm_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
    - id: edge_5
      source: if_2
      sourceHandle: 'false'
      target: code_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: code
    - id: edge_6
      source: code_6
      sourceHandle: ''
      target: llm_7
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
    - id: edge_7
      source: llm_5
      sourceHandle: ''
      target: end_8
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    - id: edge_8
      source: llm_7
      sourceHandle: ''
      target: end_8
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
