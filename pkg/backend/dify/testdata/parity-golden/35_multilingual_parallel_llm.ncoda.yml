app:
  mode: advanced-chat
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
    - id: llm_2
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: Always speak English.
        - role: user
          text: '{{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_1
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM 2
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.7
        prompt_template:
        - role: system
          text: Always speak Chinese.
        - role: user
          text: '{{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_1
    - id: answer_4
      type: custom
      data:
        type: answer
        title: Answer
        answer: '{{#llm_3.text#}}{{#llm_2.text#}}'
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: llm_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_2
      source: start_1
      sourceHandle: ''
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
    - id: edge_3
      source: llm_2
      sourceHandle: ''
      target: answer_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
    - id: edge_4
      source: llm_3
      sourceHandle: ''
      target: answer_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
