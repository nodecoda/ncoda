app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: value
          type: text-input
          variable: value
          default: probe
    - id: output_2
      type: custom
      data:
        type: end
        title: output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - start_1
          - value
    - id: code_3
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(var_0) -> dict:\n    return {\"result\": {var_0} + \":second\"\
          }"
        variables:
        - value_selector:
          - start_1
          - value
          value_type: string
          variable: var_0
        outputs:
          result:
            type: string
            children: null
    - id: output_4
      type: custom
      data:
        type: end
        title: output 2
        outputs:
        - variable: output_2
          value_type: string
          value_selector:
          - code_3
          - result
    - id: code_5
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "# ncoda:shim 1\ndef main(value) -> dict:\n    return {\"result\": (value\
          \ + \":final\")}"
        variables:
        - value_selector:
          - start_1
          - value
          value_type: string
          variable: value
        outputs:
          result:
            type: string
            children: null
    - id: end_6
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output_3
          value_type: string
          value_selector:
          - code_5
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: output_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: end
    - id: edge_2
      source: output_2
      sourceHandle: ''
      target: code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: end
        targetType: code
    - id: edge_3
      source: code_3
      sourceHandle: ''
      target: output_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    - id: edge_4
      source: output_4
      sourceHandle: ''
      target: code_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: end
        targetType: code
    - id: edge_5
      source: code_5
      sourceHandle: ''
      target: end_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
