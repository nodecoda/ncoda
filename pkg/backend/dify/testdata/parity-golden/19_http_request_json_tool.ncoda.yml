app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables: []
    - id: http_2
      type: custom
      data:
        type: http-request
        title: HTTP Request
        method: GET
        url: https://api.example.com/data
        headers: ''
        params: ''
        body:
          type: none
          data: ''
        authorization:
          type: no-auth
        variables: []
    - id: code_3
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "import json\ndef main(response: str) -> dict:\n    return {\"result\"\
          : json.loads(response)}"
        variables:
        - value_selector:
          - http_2
          - body
          value_type: string
          variable: response
        outputs:
          result:
            type: object
            children: null
    - id: end_4
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: object
          value_selector:
          - code_3
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: http_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
    - id: edge_2
      source: http_2
      sourceHandle: ''
      target: code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: code
    - id: edge_3
      source: code_3
      sourceHandle: ''
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
