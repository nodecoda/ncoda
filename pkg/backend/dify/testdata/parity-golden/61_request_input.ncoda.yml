app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables: []
    - id: human_input_2
      type: custom
      data:
        type: human-input
        title: Human Input
        form_content: 'Review


          **comment**


          {{#$output.comment#}}


          **priority**


          {{#$output.priority#}}'
        inputs:
        - type: paragraph
          output_variable_name: comment
          default:
            type: constant
            selector: []
            value: ''
        - type: select
          output_variable_name: priority
          option_source:
            type: constant
            selector: []
            value:
            - low
            - high
        user_actions:
        - id: approve
          title: Approve
          button_style: primary
        - id: reject
          title: Reject
          button_style: default
        timeout: 3
        timeout_unit: day
        delivery_methods:
        - id: efe6d227-380e-5d0e-ab73-06641d3097ff
          type: webapp
          enabled: true
    - id: end_3
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - human_input_2
          - comment
    - id: end_4
      type: custom
      data:
        type: end
        title: Output 2
        outputs:
        - variable: output_2
          value_type: string
          value_selector:
          - human_input_2
          - priority
    - id: code_5
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": \"timed out\"}"
        variables: []
        outputs:
          result:
            type: string
            children: null
    - id: end_6
      type: custom
      data:
        type: end
        title: Output 3
        outputs:
        - variable: output_3
          value_type: string
          value_selector:
          - code_5
          - result
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: human_input_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: human-input
    - id: edge_2
      source: human_input_2
      sourceHandle: approve
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: human-input
        targetType: end
    - id: edge_3
      source: human_input_2
      sourceHandle: reject
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: human-input
        targetType: end
    - id: edge_4
      source: code_5
      sourceHandle: ''
      target: end_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    - id: edge_5
      source: human_input_2
      sourceHandle: __timeout
      target: code_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: human-input
        targetType: code
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
