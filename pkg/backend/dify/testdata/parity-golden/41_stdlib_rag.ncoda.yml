app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
    - id: knowledge_2
      type: custom
      data:
        type: knowledge-retrieval
        title: Knowledge Retrieval
        dataset_ids:
        - ds-001
        - ds-002
        query_variable_selector:
          value_selector:
          - start_1
          - query
          value_type: string
          variable: query
        query: ''
        retrieval_mode: single
        single_retrieval_config:
          model:
            completion_params: {}
            mode: chat
            name: ''
            provider: ''
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai
          name: gpt-4o
          mode: chat
        prompt_template:
        - role: system
          text: Answer using the retrieved context.
        - role: user
          text: 'Context:

            {{#knowledge_2.result#}}


            Question:

            {{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - knowledge_2
          - result
          value_type: array[object]
          variable: value_1
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_2
    - id: end_4
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_3
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: knowledge_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: knowledge-retrieval
    - id: edge_2
      source: knowledge_2
      sourceHandle: ''
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: knowledge-retrieval
        targetType: llm
    - id: edge_3
      source: llm_3
      sourceHandle: ''
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
