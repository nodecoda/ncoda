app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: url
          type: text-input
          variable: url
          required: true
    - id: http_2
      type: custom
      data:
        type: http-request
        title: HTTP Request
        method: GET
        url: '{{#start_1.url#}}'
        headers: ''
        params: ''
        body:
          type: none
          data: ''
        authorization:
          type: no-auth
        variables: []
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.3
            max_tokens: 1024
        prompt_template:
        - role: user
          text: 请总结以下网页内容：\n{{#http_2.body#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - http_2
          - body
          value_type: string
          variable: value_1
    - id: answer_4
      type: custom
      data:
        type: answer
        title: Answer
        answer: 网页状态码：{{#http_2.status_code#}}\n\n摘要：{{#llm_3.text#}}
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: http_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
    - id: edge_2
      source: http_2
      sourceHandle: ''
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
    - id: edge_3
      source: llm_3
      sourceHandle: ''
      target: answer_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
