app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - query
            comparison_operator: is
            value: hello
        - case_id: if_2_case_1
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - query
            comparison_operator: is
            value: Hello
    - id: end_3
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - start_1
          - query
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
    - id: edge_2
      source: if_2
      sourceHandle: if_2_case_0
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    - id: edge_3
      source: if_2
      sourceHandle: if_2_case_1
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    - id: edge_4
      source: if_2
      sourceHandle: 'false'
      target: end_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
