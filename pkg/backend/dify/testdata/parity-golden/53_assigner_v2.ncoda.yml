app:
  mode: advanced-chat
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables:
  - id: 42da1f76-0723-556e-8d69-2eeb5b16c4f1
    name: username
    value_type: string
    value: guest
    description: ''
    selector:
    - conversation
    - username
  - id: bced39b6-c7ac-503b-81fb-6bc3e63c0ce5
    name: score
    value_type: integer
    value: 0
    description: ''
    selector:
    - conversation
    - score
  - id: 668e2cb3-17c2-5644-8065-8920d2a763c6
    name: tags
    value_type: array[string]
    value: []
    description: ''
    selector:
    - conversation
    - tags
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
        - label: new_tag
          type: text-input
          variable: new_tag
          required: true
    - id: assigner_2
      type: custom
      data:
        type: assigner
        title: assigner
        items:
        - variable_selector:
          - conversation
          - username
          operation: set
          input_type: constant
          value: updated
        version: '2'
    - id: assigner_3
      type: custom
      data:
        type: assigner
        title: assigner 2
        items:
        - variable_selector:
          - conversation
          - score
          operation: +=
          input_type: constant
          value: 10
        version: '2'
    - id: assigner_4
      type: custom
      data:
        type: assigner
        title: assigner 3
        items:
        - variable_selector:
          - conversation
          - tags
          operation: append
          input_type: variable
          value:
          - start_1
          - new_tag
        version: '2'
    - id: answer_5
      type: custom
      data:
        type: answer
        title: Answer
        answer: '{{#conversation.username#}}'
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: assigner_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: assigner
    - id: edge_2
      source: assigner_2
      sourceHandle: ''
      target: assigner_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: assigner
        targetType: assigner
    - id: edge_3
      source: assigner_3
      sourceHandle: ''
      target: assigner_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: assigner
        targetType: assigner
    - id: edge_4
      source: assigner_4
      sourceHandle: ''
      target: answer_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: assigner
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
