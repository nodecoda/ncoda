app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: text
          type: text-input
          variable: text
          default: Hello Dify
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(text: str) -> dict:\n    words = text.split()\n    return\
          \ {\n        \"count\": len(words),\n        \"normalized\": \" \".join(words).lower()\n\
          \    }"
        variables:
        - value_selector:
          - start_1
          - text
          value_type: string
          variable: text
        outputs:
          count:
            type: number
            children: null
          normalized:
            type: string
            children: null
    - id: answer_3
      type: custom
      data:
        type: answer
        title: Answer
        answer: '{{#code_2.normalized#}} ({{#code_2.count#}})'
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: code_2
      sourceHandle: ''
      target: answer_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
