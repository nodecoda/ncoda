app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: item
          type: text-input
          variable: item
          required: true
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "# ncoda:shim 1\ndef main(item) -> dict:\n    return {\"result\": [item]}"
        variables:
        - value_selector:
          - start_1
          - item
          value_type: string
          variable: item
        outputs:
          result:
            type: array[string]
            children: null
    - id: iteration_start_4
      type: custom-iteration-start
      data:
        type: iteration-start
        selected: false
        title: Iteration Start
        desc: ''
        isInIteration: true
        iteration_id: iteration_3
      parentId: iteration_3
      zIndex: 1002
    - id: iteration_3
      type: custom
      data:
        type: iteration
        title: Iteration
        iterator_selector:
        - code_2
        - result
        output_selector: []
        output_type: ''
        iterator_input_type: array[string]
        start_node_id: iteration_start_4
    - id: llm_5
      type: custom
      data:
        type: llm
        title: LLM
        iteration_id: iteration_3
        isInIteration: true
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.1
            max_tokens: 256
        prompt_template:
        - role: user
          text: 请翻译以下内容为英文：{{#iteration_3.item#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - iteration_3
          - item
          value_type: string
          variable: value_1
      parentId: iteration_3
      zIndex: 1002
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: code_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: code_2
      sourceHandle: ''
      target: iteration_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: iteration
    - id: edge_3
      source: iteration_start_4
      sourceHandle: ''
      target: llm_5
      targetHandle: target
      type: custom
      data:
        isInIteration: true
        isInLoop: false
        sourceType: iteration-start
        targetType: llm
        iteration_id: iteration_3
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
