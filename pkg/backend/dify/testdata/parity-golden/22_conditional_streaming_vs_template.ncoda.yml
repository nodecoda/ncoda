app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: query
          type: text-input
          variable: query
          required: true
        - label: name
          type: text-input
          variable: name
          required: true
        - label: use_streaming
          type: text-input
          variable: use_streaming
          required: true
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - use_streaming
            comparison_operator: is
            value: 'true'
    - id: llm_3
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
        prompt_template:
        - role: user
          text: '{{#start_1.query#}}'
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - start_1
          - query
          value_type: string
          variable: value_1
    - id: template_4
      type: custom
      data:
        type: template-transform
        title: Template
        template: 'Hello, {{#start_1.name#}}! Your query was: {{#start_1.query#}}'
        variables: []
    - id: end_5
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - llm_3
          - text
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
    - id: edge_2
      source: if_2
      sourceHandle: if_2_case_0
      target: llm_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: llm
    - id: edge_3
      source: if_2
      sourceHandle: 'false'
      target: template_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: template-transform
    - id: edge_4
      source: llm_3
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: end
    - id: edge_5
      source: template_4
      sourceHandle: ''
      target: end_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
