app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables: []
    - id: code_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": [1, 2, 4, 6]}"
        variables: []
        outputs:
          result:
            type: array[number]
            children: null
    - id: select_value_param_3
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main(values) -> dict:\n    return {'values': values}"
        variables:
        - value_selector:
          - code_2
          - result
          value_type: array[number]
          variable: values
        outputs:
          values:
            type: array[number]
            children: null
    - id: select_value_for_length_4
      type: custom
      data:
        type: code
        title: Code 3
        code_language: python3
        code: "def main(items) -> dict:\n    return {\"result\": len(items)}"
        variables:
        - value_selector:
          - select_value_param_3
          - values
          value_type: array[number]
          variable: items
        outputs:
          result:
            type: number
            children: null
    - id: select_value_for_loop_start_6
      type: custom-loop-start
      data:
        type: loop-start
        selected: false
        title: Loop Start
        desc: ''
        loop_id: select_value_for_loop_5
        isInLoop: true
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_loop_5
      type: custom
      data:
        type: loop
        title: Loop
        loop_variables:
        - label: __items
          value_type: variable
          var_type: array[number]
          id: c7816070-9a62-547c-8823-ab2b427478c9
          value:
          - select_value_param_3
          - values
        - label: __index
          value_type: constant
          var_type: number
          id: 56cfb18b-1cd8-510c-97b3-32c86e4785bf
          value: 0
        - label: __length
          value_type: variable
          var_type: number
          id: cb4b6c85-4b07-597e-a3d9-871085ccd957
          value:
          - select_value_for_length_4
          - result
        - label: __returning
          value_type: constant
          var_type: boolean
          id: 2a1290e9-fcd5-569b-a684-6957b29f1950
          value: false
        - label: __return_value
          value_type: constant
          var_type: number
          id: 2e733260-e885-5bf5-9b2b-278d781389a0
          value: 0
        break_conditions:
        - variable_selector:
          - select_value_for_loop_5
          - __index
          comparison_operator: ≥
          value: '{{#select_value_for_loop_5.__length#}}'
        loop_count: 100
        logical_operator: and
        start_node_id: select_value_for_loop_start_6
    - id: select_value_for_item_7
      type: custom
      data:
        type: code
        title: Code 4
        loop_id: select_value_for_loop_5
        isInLoop: true
        code_language: python3
        code: "def main(items, index) -> dict:\n    return {\"result\": items[index]}"
        variables:
        - value_selector:
          - select_value_for_loop_5
          - __items
          value_type: array[number]
          variable: items
        - value_selector:
          - select_value_for_loop_5
          - __index
          value_type: number
          variable: index
        outputs:
          result:
            type: number
            children: null
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_if_8
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        loop_id: select_value_for_loop_5
        isInLoop: true
        cases:
        - case_id: select_value_if_8_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - select_value_for_item_7
            - result
            comparison_operator: '='
            value: '1'
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_if_9
      type: custom
      data:
        type: if-else
        title: IF/ELSE 2
        loop_id: select_value_for_loop_5
        isInLoop: true
        cases:
        - case_id: select_value_if_9_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - select_value_for_item_7
            - result
            comparison_operator: '='
            value: '4'
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_if_10
      type: custom
      data:
        type: if-else
        title: IF/ELSE 3
        loop_id: select_value_for_loop_5
        isInLoop: true
        cases:
        - case_id: select_value_if_10_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - select_value_for_item_7
            - result
            comparison_operator: '>'
            value: '4'
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_increment_11
      type: custom
      data:
        type: assigner
        title: assigner
        loop_id: select_value_for_loop_5
        isInLoop: true
        items:
        - variable_selector:
          - select_value_for_loop_5
          - __index
          operation: +=
          input_type: constant
          value: 1
        version: '2'
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_loop_end_12
      type: custom-simple
      data:
        type: loop-end
        title: Exit Loop
        loop_id: select_value_for_loop_5
        isInLoop: true
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_return_13
      type: custom
      data:
        type: assigner
        title: assigner 2
        loop_id: select_value_for_loop_5
        isInLoop: true
        items:
        - variable_selector:
          - select_value_for_loop_5
          - __returning
          operation: set
          input_type: constant
          value: true
        - variable_selector:
          - select_value_for_loop_5
          - __return_value
          operation: over-write
          input_type: variable
          value:
          - select_value_for_item_7
          - result
        version: '2'
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_return_end_14
      type: custom-simple
      data:
        type: loop-end
        title: Exit Loop 2
        loop_id: select_value_for_loop_5
        isInLoop: true
      parentId: select_value_for_loop_5
      zIndex: 1002
    - id: select_value_for_return_check_15
      type: custom
      data:
        type: if-else
        title: IF/ELSE 4
        cases:
        - case_id: select_value_for_return_check_15_return
          logical_operator: and
          conditions:
          - variable_selector:
            - select_value_for_loop_5
            - __returning
            comparison_operator: '='
            value: 'true'
    - id: select_value_return_16
      type: custom
      data:
        type: code
        title: Code 5
        code_language: python3
        code: "def main(for_return_select_value_for_loop_5) -> dict:\n    return {\"\
          result\": for_return_select_value_for_loop_5}"
        variables:
        - value_selector:
          - select_value_for_loop_5
          - __return_value
          value_type: number
          variable: for_return_select_value_for_loop_5
        outputs:
          result:
            type: number
            children: null
    - id: select_value_return_17
      type: custom
      data:
        type: code
        title: Code 6
        code_language: python3
        code: "def main() -> dict:\n    return {\"result\": 0}"
        variables: []
        outputs:
          result:
            type: number
            children: null
    - id: select_value_return_merge_18
      type: custom
      data:
        type: variable-aggregator
        title: Variable Aggregator
        variables:
        - - select_value_return_16
          - result
        - - select_value_return_17
          - result
        output_type: number
    - id: end_19
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: number
          value_selector:
          - select_value_return_merge_18
          - output
