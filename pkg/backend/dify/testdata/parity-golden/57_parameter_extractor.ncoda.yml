app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: text
          type: text-input
          variable: text
          required: true
    - id: extract_2
      type: custom
      data:
        type: parameter-extractor
        title: Parameter Extractor
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
        parameters:
        - name: city
          type: string
          description: Destination city
          required: true
        - name: days
          type: number
          description: Trip duration in days
          required: true
        - name: flexible
          type: boolean
          description: Whether travel dates are flexible
          required: true
        - name: tags
          type: array[string]
          description: Travel preferences
          required: true
        query:
        - start_1
        - text
        instruction: Extract a travel request
        reasoning_mode: prompt
        vision:
          enabled: false
    - id: extract_result_3
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(__is_success, __reason, __usage, field_0, field_1, field_2,\
          \ field_3):\n    return {\n        \"ok\": bool(__is_success),\n       \
          \ \"reason\": __reason or \"\",\n        \"usage\": __usage or {},\n   \
          \     \"value\": {\n            \"city\": field_0,\n            \"days\"\
          : field_1,\n            \"flexible\": field_2,\n            \"tags\": field_3,\n\
          \        },\n    }"
        variables:
        - value_selector:
          - extract_2
          - __is_success
          value_type: number
          variable: __is_success
        - value_selector:
          - extract_2
          - __reason
          value_type: string
          variable: __reason
        - value_selector:
          - extract_2
          - __usage
          value_type: object
          variable: __usage
        - value_selector:
          - extract_2
          - city
          value_type: string
          variable: field_0
        - value_selector:
          - extract_2
          - days
          value_type: number
          variable: field_1
        - value_selector:
          - extract_2
          - flexible
          value_type: boolean
          variable: field_2
        - value_selector:
          - extract_2
          - tags
          value_type: array[string]
          variable: field_3
        outputs:
          value:
            type: object
            children:
              city:
                type: string
                children: null
              days:
                type: number
                children: null
              flexible:
                type: boolean
                children: null
              tags:
                type: array[string]
                children: null
          ok:
            type: boolean
            children: null
          reason:
            type: string
            children: null
          usage:
            type: object
            children: null
    - id: end_4
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: object
          value_selector:
          - extract_result_3
          - value
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: extract_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: parameter-extractor
    - id: edge_2
      source: extract_2
      sourceHandle: source
      target: extract_result_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: parameter-extractor
        targetType: code
    - id: edge_3
      source: extract_result_3
      sourceHandle: ''
      target: end_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
