app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: request
          type: text-input
          variable: request
          required: true
        - label: category
          type: text-input
          variable: category
          default: general
    - id: if_2
      type: custom
      data:
        type: if-else
        title: IF/ELSE
        cases:
        - case_id: if_2_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - category
            comparison_operator: is
            value: billing
    - id: template_3
      type: custom
      data:
        type: template-transform
        title: Template
        template: 'BILLING: {{#start_1.request#}}'
        variables: []
    - id: if_4
      type: custom
      data:
        type: if-else
        title: IF/ELSE 2
        cases:
        - case_id: if_4_case_0
          logical_operator: and
          conditions:
          - variable_selector:
            - start_1
            - category
            comparison_operator: is
            value: technical
    - id: template_5
      type: custom
      data:
        type: template-transform
        title: Template 2
        template: 'TECHNICAL: {{#start_1.request#}}'
        variables: []
    - id: template_6
      type: custom
      data:
        type: template-transform
        title: Template 3
        template: 'GENERAL: {{#start_1.request#}}'
        variables: []
    - id: end_7
      type: custom
      data:
        type: end
        title: Output
        outputs:
        - variable: output
          value_type: string
          value_selector:
          - template_3
          - output
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: if_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: if-else
    - id: edge_2
      source: if_2
      sourceHandle: if_2_case_0
      target: template_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: template-transform
    - id: edge_3
      source: if_2
      sourceHandle: 'false'
      target: if_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: if-else
    - id: edge_4
      source: if_4
      sourceHandle: if_4_case_0
      target: template_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: template-transform
    - id: edge_5
      source: if_4
      sourceHandle: 'false'
      target: template_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: template-transform
    - id: edge_6
      source: template_3
      sourceHandle: ''
      target: end_7
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
    - id: edge_7
      source: template_5
      sourceHandle: ''
      target: end_7
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
    - id: edge_8
      source: template_6
      sourceHandle: ''
      target: end_7
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: template-transform
        targetType: end
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
