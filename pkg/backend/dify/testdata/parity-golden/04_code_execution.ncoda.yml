app:
  mode: workflow
  name: ''
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  rag_pipeline_variables: []
  features:
    file_upload: {}
    sensitive_word_avoidance:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
    opening_statement: ''
    retriever_resource:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
  graph:
    nodes:
    - id: start_1
      type: custom
      data:
        type: start
        title: User Input
        variables:
        - label: text
          type: text-input
          variable: text
          required: true
    - id: analyze_text_param_2
      type: custom
      data:
        type: code
        title: Code
        code_language: python3
        code: "def main(text) -> dict:\n    return {'text': text}"
        variables:
        - value_selector:
          - start_1
          - text
          value_type: string
          variable: text
        outputs:
          text:
            type: string
            children: null
    - id: analyze_text_code_3
      type: custom
      data:
        type: code
        title: Code 2
        code_language: python3
        code: "def main(text: str) -> dict:\n    words = text.split()\n    word_count\
          \ = len(words)\n    char_count = len(text)\n    return {\n        \"word_count\"\
          : word_count,\n        \"char_count\": char_count,\n        \"summary\"\
          : f\"文本包含 {word_count} 个词，{char_count} 个字符\"\n    }"
        variables:
        - value_selector:
          - analyze_text_param_2
          - text
          value_type: string
          variable: text
        outputs:
          word_count:
            type: number
            children: null
          char_count:
            type: number
            children: null
          summary:
            type: string
            children: null
    - id: analyze_text_code_struct_4
      type: custom
      data:
        type: code
        title: Code 3
        code_language: python3
        code: "def main(word_count, char_count, summary) -> dict:\n    return {\"\
          result\": {'word_count': word_count, 'char_count': char_count, 'summary':\
          \ summary}}"
        variables:
        - value_selector:
          - analyze_text_code_3
          - word_count
          value_type: number
          variable: word_count
        - value_selector:
          - analyze_text_code_3
          - char_count
          value_type: number
          variable: char_count
        - value_selector:
          - analyze_text_code_3
          - summary
          value_type: string
          variable: summary
        outputs:
          result:
            type: object
            children:
              word_count:
                type: number
                children: null
              char_count:
                type: number
                children: null
              summary:
                type: string
                children: null
    - id: analyze_text_return_5
      type: custom
      data:
        type: code
        title: Code 4
        code_language: python3
        code: "def main(result) -> dict:\n    return {\"result\": result}"
        variables:
        - value_selector:
          - analyze_text_code_3
          value_type: object
          variable: result
        outputs:
          result:
            type: object
            children:
              word_count:
                type: number
                children: null
              char_count:
                type: number
                children: null
              summary:
                type: string
                children: null
    - id: llm_6
      type: custom
      data:
        type: llm
        title: LLM
        model:
          provider: openai_api_compatible
          name: gpt-5.4
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - role: user
          text: 根据以下统计信息写一段分析：\n{{#analyze_text_return_5.result.summary#}}
        context:
          enabled: false
          variable_selector: []
        variables:
        - value_selector:
          - analyze_text_return_5
          - result
          - summary
          value_type: string
          variable: value_1
    - id: answer_7
      type: custom
      data:
        type: answer
        title: Answer
        answer: 统计：{{#analyze_text_return_5.result.summary#}}\n\n分析：{{#llm_6.text#}}
        variables: []
    edges:
    - id: edge_1
      source: start_1
      sourceHandle: ''
      target: analyze_text_param_2
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
    - id: edge_2
      source: analyze_text_param_2
      sourceHandle: ''
      target: analyze_text_code_3
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_3
      source: analyze_text_code_3
      sourceHandle: ''
      target: analyze_text_code_struct_4
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_4
      source: analyze_text_code_struct_4
      sourceHandle: ''
      target: analyze_text_return_5
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
    - id: edge_5
      source: analyze_text_return_5
      sourceHandle: ''
      target: llm_6
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: llm
    - id: edge_6
      source: llm_6
      sourceHandle: ''
      target: answer_7
      targetHandle: target
      type: custom
      data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: answer
    viewport:
      x: 0
      y: 0
      zoom: 1
dependencies: []
