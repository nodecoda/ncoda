name: release

# Tag push = release. Produces 6-platform binaries + SHA256SUMS + SBOM text.
# Publishing target = nodecoda/ncoda-release (consumed by @nodecoda/skill
# postinstall). Cross-repo upload needs secrets.PUBLISH_TOKEN; without it the
# workflow still builds and uploads artifacts to the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7.0)'
        required: true

permissions:
  contents: write
  id-token: write   # keyless cosign (only used when vars.NCODA_SIGN == 'true')

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `secrets` 不能直接出现在步骤的 `if:` 里（GitHub 会判 workflow 文件无效：
    # Unrecognized named-value: 'secrets'）。先落到 job 级 env，再用 env 判。
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            case "$V" in v*) ;; *) V="v$V" ;; esac
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
      - name: Build 6 platforms
        run: make dist VERSION="${{ steps.ver.outputs.tag }}"
      # The same gate developers run (`make release-smoke`), not an inline copy:
      # v0.7.0 failed here because the inline assertions described a CLI and a
      # dist layout that had both changed during the split.
      - name: Release smoke (dist layout + CLI contract, linux amd64)
        run: make release-smoke VERSION="${{ steps.ver.outputs.tag }}"
      - name: Install cosign (opt-in)
        if: ${{ vars.NCODA_SIGN == 'true' }}
        uses: sigstore/cosign-installer@v3
      - name: Sign and verify SHA256SUMS (keyless)
        if: ${{ vars.NCODA_SIGN == 'true' }}
        run: |
          D=/tmp/ncoda-dist-${{ steps.ver.outputs.tag }}
          cd "$D"
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nclang-${{ steps.ver.outputs.tag }}
          path: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
      - name: Publish to nodecoda/ncoda-release
        if: ${{ env.PUBLISH_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: nodecoda/ncoda-release
          token: ${{ secrets.PUBLISH_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: nclang ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
