name: release

# Tag push = release. Produces 6-platform binaries + SHA256SUMS + SBOM text.
# Publishing target = nodecoda/ncoda-release (consumed by @nodecoda/skill
# postinstall). Cross-repo upload needs secrets.PUBLISH_TOKEN; without it the
# workflow still builds and uploads artifacts to the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            case "$V" in v*) ;; *) V="v$V" ;; esac
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
      - name: Build 6 platforms
        run: make dist VERSION="${{ steps.ver.outputs.tag }}"
      - name: Smoke (linux amd64)
        run: |
          BIN=/tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/nclang-${{ steps.ver.outputs.tag }}-linux-amd64
          printf '' | "$BIN" | grep -q '"status":"COMPILE_ERROR"'
      - uses: actions/upload-artifact@v4
        with:
          name: nclang-${{ steps.ver.outputs.tag }}
          path: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
      - name: Publish to nodecoda/ncoda-release
        if: ${{ secrets.PUBLISH_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: nodecoda/ncoda-release
          token: ${{ secrets.PUBLISH_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: nclang ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
