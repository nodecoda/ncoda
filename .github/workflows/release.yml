name: release

# Tag push = release. Produces 6-platform binaries + SHA256SUMS + SBOM text.
# Publishing target = nodecoda/ncoda-release (consumed by @nodecoda/skill
# postinstall). Cross-repo upload needs secrets.PUBLISH_TOKEN; without it the
# workflow still builds and uploads artifacts to the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.7.0)'
        required: true

permissions:
  contents: write
  id-token: write   # keyless cosign (only used when vars.NCODA_SIGN == 'true')

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
            case "$V" in v*) ;; *) V="v$V" ;; esac
          else
            V="${GITHUB_REF_NAME}"
          fi
          echo "tag=$V" >> "$GITHUB_OUTPUT"
      - name: Build 6 platforms
        run: make dist VERSION="${{ steps.ver.outputs.tag }}"
      - name: Smoke (linux amd64)
        run: |
          BIN=/tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/nclang-${{ steps.ver.outputs.tag }}-linux-amd64
          printf '' | "$BIN" | grep -q '"status":"COMPILE_ERROR"'
      - name: Validate SBOM
        run: |
          python3 scripts/gen_sbom.py --check             /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/sbom.cdx.json
      - name: Validate artifacts (license manifest)
        run: |
          D=/tmp/ncoda-dist-${{ steps.ver.outputs.tag }}
          for f in LICENSE NOTICE sbom.cdx.json SBOM.txt SHA256SUMS; do
            test -s "$D/$f" || { echo "missing $f"; exit 1; }
          done
          cd "$D" && sha256sum -c SHA256SUMS --quiet
      - name: Install cosign (opt-in)
        if: ${{ vars.NCODA_SIGN == 'true' }}
        uses: sigstore/cosign-installer@v3
      - name: Sign and verify SHA256SUMS (keyless)
        if: ${{ vars.NCODA_SIGN == 'true' }}
        run: |
          D=/tmp/ncoda-dist-${{ steps.ver.outputs.tag }}
          cd "$D"
          cosign sign-blob --yes --bundle SHA256SUMS.cosign.bundle SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.cosign.bundle \
            --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nclang-${{ steps.ver.outputs.tag }}
          path: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
      - name: Publish to nodecoda/ncoda-release
        if: ${{ secrets.PUBLISH_TOKEN != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: nodecoda/ncoda-release
          token: ${{ secrets.PUBLISH_TOKEN }}
          tag_name: ${{ steps.ver.outputs.tag }}
          name: nclang ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: /tmp/ncoda-dist-${{ steps.ver.outputs.tag }}/*
