schema: ncoda.open.platform-identity-residuals/v1
#
# 开源内核里**仍然与平台身份有关**的代码位置（ASSET-BOUNDARY D8 / P2f）。
#
# 判据：scripts/audit_split.py S6 扫内核 Go 标识符（去注释、去字符串后），
# 任何含平台名的标识符都必须在本文件的 items 里登记；反之，登记了但代码里
# 已不存在也判红（台账必须随代码一起缩小）。S7 再判一层更强的：整个公开树
# （含注释/文档/路径）不得出现平台名字面量，闸门脚本自身除外。
#
# 2026-10-25：**items 已清空**，且适配器的全部事实（目标名、承载轴、能力表、
# 线拼写、夹具与文档）都在商业仓，由各适配器显式声明后注入。内核不认识任何
# 平台名 —— 没有按名回退。
items: []

# 过渡桥：内核仍认识「历史目标名」，因为商业仓 v0.6.0 的 profile / capability
# 表还没有显式声明这些轴。每条都必须写清 what / why / unblock。
transitional_name_gates:
  - id: TN-3
    file: pkg/passes/capability.go
    symbol: CapabilityManifestForTarget
    what: >-
      保留一个历史目标名的分支（能力清单按平台名返回）。
    why: >-
      商业仓 archgate 的 v0.6.0/HEAD 双态台账要求该函数在两个版本都存在；
      v0.6.0 的调用点仍按名查表。函数体已不是任何平台事实的正本（正本在
      internal/backend/*/capability_manifest.go）。
    unblock: >-
      bump 后消费方改指适配器清单（internal/compiler.capabilityManifestForTarget
      已先行），删除该函数并从 archgate 的 targetLayerFiles 摘除。
  - id: TN-4
    file: pkg/ir/build.go
    symbol: IRPortVocabularyTarget / choosePortVocabularyTarget
    what: >-
      IR 端口词汇表仍优先取一个历史目标名对应的 builtin 契约。
    why: >-
      多平台构建的历史口径要求「含该契约时优先取它」；改动会改变 IR 端口名，
      属「IR 只带语言名」的独立切片（设计债已登记在函数头注）。
    unblock: >-
      IR 端口词汇表下沉为语言自有契约（builtins/ncoda-language.yaml 已是种子），
      各后端用自己的映射表把语言口名翻成平台口名。
  - id: TN-5
    file: pkg/runner/run.go
    symbol: Run
    what: >-
      runtime lane 仍以 flow.Project 产出 spec.Build 需要的投影。
    why: >-
      spec.Build 现在的入参是 *flow.Projection；P4b 的落点是让它直接吃
      Plan.Semantics。`pkg/backend/flow` 的边界闸门已经把这条登记为唯一的生产
      例外（projectAllow），不是新增的隐式消费。
    unblock: >-
      spec.Build 改吃 obligation.Semantics，删掉 projectAllow 里的 pkg/runner/run.go。
  - id: TN-6
    file: pkg/runtime/spec
    symbol: sidecar profile / exec-sem census 证据串
    what: >-
      runtime 侧测试仍引用平台 profile 名与平台文档路径（字符串字面量，S6 不判）。
    why: >-
      这些是随 runtime 一起搬过来的**继承事实**：sidecar 的 profile 字段与
      exec-sem 字段普查的证据串写死了历史目标名。它们不参与内核二进制行为
      （测试/数据面），但确实还带着平台词汇。
    unblock: >-
      sidecar profile 改为适配器声明的 profile 名（经 target 注册表注入），
      census 证据串改为指向语料仓的稳定锚点。
