schema: ncoda.plugin/v1
id: compose-toolkit
version: 0.1.0
protocol: ncoda-plugin/1
type: stdio
command: ["python3", "server.py"]
timeout_ms: 30000
max_restarts: 3
libraries:
  # 音频时间线合并：唯一函数 timeline_merge，按「单个 gap 段」实现。
  # 证据：7572879904859111459:186,189 传 gap_us=int(TTS 时长)，gap_us_timeline
  # 同时喂 1 个 mp3、1 条标题文案与 add_videos 的 scene_timelines；v34 以最后一段
  # 的 end 作为视频起点。
  - library: audio_timeline_merge
    version: 0.1.0
    fidelity: partial
    loss: "库级：timeline_merge 采用 [pre][gap][main] 拼接 + 单个 gap 段；gap 是否为「每段一个」、all_complete_timeline 是否要包含 gap 占位段未证实"
    functions:
      - name: timeline_merge
        loss: "skip_us 为整块平移（同 suchuang_video_compose.timeline_merge）；gap_us_timeline 取 pre 与 main 之间的单个 gap 段，gap_us=0 时为空。未证实：① gap 是否应为每段一个（若如此，1 条文案仍只配第一段）② all_complete_timeline 是否要包含 gap 占位段（目前等于 timelines）③ main 是否反而应从 gap 起点算（v24 用 v4 作视频起点，与 pre_end+gap 模型不一致）。contact 全语料 0 消费 ⇒ 空串"
  # 剪映小助手：纯列表/文本/时间轴变换（不触网、不读写草稿）。
  - library: capcut_helper
    version: 0.1.0
    fidelity: real
    functions:
      - audio_link_collector
      - name: text_splitter
        fidelity: partial
        loss: "切分粒度未由语料证实：按空行分段、段内按句末标点切句；原实现的合并阈值可能不同"
      - name: timeline_merge
        fidelity: partial
        loss: "skip_us = 整块平移量（语料把上一轮 last_end_us 传进来：7551643866874150912:313、7577698754514960419:330、7572110422062383146:310；常量配对 skip=2.5s/gap=1.5s 见 7577251869463134243:229）：pre 与 main 一起后移，main 再额外后移 max(pre.end)+gap_us；all_timeline 取 [0, last_end_us]，all_complete_timeline 目前等于 timelines（gap 是否要补占位段、all_timeline 是否应从 skip 起算，均无消费面证据）"
      - name: wenan_timeline_range
        fidelity: partial
        loss: "mergeCount/startIndex 的分组规则未由语料证实：按 wenan 条数均分 timelines，取每组首尾；越界输入截断"
      - name: rolling_effect
        fidelity: partial
        loss: "滚动/重复策略未证实：duration_list 视为逐段时长做累加，str_list 不足时循环补齐"

  # 速创视频合成：同族纯函数 + 本地 WAV 时长；草稿状态机与剩余 audio/video 探测保持 unbound。
  - library: suchuang_video_compose
    version: 0.1.0
    fidelity: real
    functions:
      - audio_link_collector
      - text_empty_removal
      - name: add_list
        fidelity: partial
        loss: "item 与 list 的合并优先级未由语料证实（语料只传 add_list）：list 优先，否则 add_list + [item]"
      - name: text_splitter
        fidelity: partial
        loss: "切分粒度未由语料证实：空行分段、段内按句末标点切句；outputList 与 segments 同值（原实现关系未证实）"
      - name: timeline_merge
        fidelity: partial
        loss: "同 capcut_helper.timeline_merge：skip_us 是整块平移量，main 再后移 max(pre.end)+gap_us；all_timeline=[0,last_end_us]，all_complete_timeline=timelines（gap 占位段无证据）"
      - name: wenan_timeline_range
        fidelity: partial
        loss: "mergeCount/startIndex 分组规则未证实：按 wenan 条数均分 timelines"
      - name: wenan_timeline_range_merge
        fidelity: partial
        loss: "同 wenan_timeline_range；输出时间戳为 float，合并相邻同 content 的策略未证实"
      - name: timeline_align
        fidelity: partial
        loss: "align 的原始规则未由语料证实：仅两处调用且都是 align=end，这里解释为每段 end 对齐下一段 start（末段保留），all_timeline=[0,末段end]；其它 align 值原样返回"
      - name: media_tile
        fidelity: partial
        loss: "缺省 duration 的平铺规则未证实：duration<=0 时不切分，否则按 duration 微秒切块，urls 按块数重复 media_url"
      - name: timeline_generator
        fidelity: partial
        loss: "fps/unit/timelist 语义未证实：duration 按秒解析（unit=ms/us 时换算），items 逐个等长排布"
      - name: dialog_split
        fidelity: partial
        loss: "角色前缀解析未证实：按 roles 的 `Q:`/`A:`（中英文冒号）解析，无法识别时归入首个角色"
      - name: dialog_merge
        fidelity: partial
        loss: "audioLinks 按角色取链接、按 idx 重排；同角色链接不足时跳过该条（原实现的兜底未证实）"
      - name: dialog_wenan_timeline
        fidelity: partial
        loss: "按 idx 顺序把 timelines 依次分配给各角色对话；与 dialog_merge 的严格对齐未证实"
      - name: get_audio_duration
        fidelity: partial
        loss: "读取本地 WAV/MP3（WAV=data/byteRate；MP3=Layer III 帧计数，有 Xing/Info 时用其帧数）：unit=微秒(或缺省)返回 µs，unit=秒返回秒（语料 39 处全部显式传，7554469499115765795 对秒值 ×1e6）；http(s) 默认显式 REMOTE_AUDIO_UNSUPPORTED；AAC/OGG/FLAC 与 MPEG Layer I/II 未覆盖，其他 unit 显式报错；远程分支只由测试 mock 钩子验证，不代表生产联网"
