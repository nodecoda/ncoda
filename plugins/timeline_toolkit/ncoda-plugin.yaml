schema: ncoda.plugin/v1
id: timeline-toolkit
version: 0.1.0
protocol: ncoda-plugin/1
type: stdio
command: ["python3", "server.py"]
timeout_ms: 30000
max_restarts: 3
libraries:
  # 证据：header 的返回类型是具体结构（不是不透明的 infos JSON 字符串），
  # 语料调用点给出参数名与消费面。分配/断句规则未由语料证实 ⇒ 全部 partial。
  - library: capcut_draft_data
    version: 0.1.0
    fidelity: partial
    loss: "库级：实现 timelines / str_to_list / caption_splitter / get_audio_duration / audio_timelines / audio_infos / image_infos；text_infos / video_infos / keyframe_infos 的消费面结构无语料证据，仍不实现"
    functions:
      - name: timelines
        loss: "语料只出现 number=1；number>1 时按整数等分且余数并入末段。原实现的分配规则与 $type 语义未证实"
      - name: str_to_list
        loss: "只做 JSON 数组字符串解析与按行拆分；逗号/分号/空格等分隔符规则未由语料证实（单行输入原样作为单元素）"
      - name: caption_splitter
        loss: "按 max_char_count 硬切（不按标点断句），再按各段字符数比例分摊该条文本的 [start,end]；texts 与 timelines 数量不等时缺省时间段记 [0,0]"
      - name: get_audio_duration
        loss: "只解码本地 WAV（路径/file:///data:audio/wav;base64）：duration = data 字节数/byteRate，单位微秒（语料 7539744063333105727:96,107 与 7566078917871140864:62,79 证明）；http(s) 默认显式 REMOTE_AUDIO_UNSUPPORTED（离线），MP3/非 WAV 需解码，显式报错；远程分支可由测试 mock 取数钩子验证，不代表生产会联网"
      - name: audio_timelines
        loss: "只解码本地 WAV（路径/file:///data:audio/wav;base64）：duration = data 字节数/byteRate；http(s)/MP3 需下载+解码，显式报 REMOTE_AUDIO_UNSUPPORTED/非 WAV；timelines 与 urls 1:1、自 0 起相接，end 为总时长（语料 7537506233444663359:101,105 证明 end 被当整段时长）；total_timelines 无语料消费点，返回整段 [0,total]"
      - name: audio_infos
        loss: "键是 url/duration/start/end（消费者是 capcut_draft_folder.add_audios 的 infos 参数，由语料手写 audioData 证明）；volume/audio_effect 仅在显式传入时写入；单 URL + 多时间段时铺满整体（bgm 语义）"
      - name: image_infos
        loss: "键是 url/start/end（消费者是 add_images 的 infos 参数）；transform_x/y、scale_x/y、进出动画及动画时长仅在显式传入且非零时写入；单 URL + 多时间段时铺满整体（背景图语义）"
  - library: capcut_data
    version: 0.1.0
    fidelity: partial
    loss: "库级：补 timeline_keyframe / asr_timelines / keyframes_infos / *_infos（逐函数 loss 见下）；audio_timelines 已由 plugins/capcut_data 实现，search_sticker 需要网络，仍不实现"
    functions:
      - name: timeline_keyframe
        loss: "偏移按每条时间线内的百分比线性插值（0%→start，100%→end），多段时间线顺序拼接；原实现的绝对/相对基准与去重策略未证实"
      - name: asr_timelines
        loss: "start_time/end_time 按「秒」×1e6 转微秒（语料把结果赋给 int 时间线）；all_timelines 暂为 timelines 的别名（无语料证据表明两者不同）；chunk 顺序按输入顺序，index 字段不参与排序"
      - name: keyframes_infos
        loss: "offset 按「段内百分比 × (end-start)」生成（语料 JS 的手写等价实现如此）；位置型 KFTypePositionX/Y 是否要按 width/height 归一化无语料证据，value 原样使用；不写 easing 字段"
      - name: audio_infos
        loss: "字段按语料手写结构 {audio_url,duration,start,end(,volume,audio_effect)}；volume/audio_effect 仅在调用方显式传入时写入（不把 header 的 0/\"\" 默认当限制值）；单 URL + 多时间段时铺满整体"
      - name: caption_infos
        loss: "字段按 {text,start,end(,in_animation,out_animation,loop_animation,…)}；font_size/keywords 等样式参数不写入 infos（语料里 680/707 个 add_captions 另行传样式），依赖 infos 内样式的调用点会有差异"
      - name: imgs_infos
        loss: "字段按语料手写结构 {image_url,start,end,width,height,transition,…}；width/height/动画只在显式传入时写入；transition 的叠化语义由下游实现"
      - name: video_infos
        loss: "字段按语料手写结构 {video_url,duration,start,end,width,height,transition,transition_duration(,volume,mask)}；play_timelines/speeds/transitions 多路参数无语料证据，忽略"
      - name: effect_infos
        loss: "字段按语料手写结构 {effect_title,start,end}；按索引与 timelines 配对，长度不等时截断"
  - library: capcut_data_fast
    version: 0.1.0
    fidelity: partial
    loss: "库级：header 的 6 个函数全部实现，但均为 partial（逐函数 loss 见下）"
    functions:
      - name: keyframes_infos
        loss: "同 capcut_data.keyframes_infos；pattern 参数无语料出现，忽略；位置型不按 width/height 归一化"
      - name: audio_infos
        loss: "同 capcut_data.audio_infos；额外带 error 字段（header 声明）"
      - name: caption_infos
        loss: "同 capcut_data.caption_infos；额外带 error 字段（header 声明）"
      - name: imgs_infos
        loss: "同 capcut_data.imgs_infos；额外带 error 字段（header 声明）"
      - name: video_infos
        loss: "同 capcut_data.video_infos；header 无 error 字段"
      - name: effect_infos
        loss: "同 capcut_data.effect_infos"
